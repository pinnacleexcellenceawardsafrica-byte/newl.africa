function updateDailyLogCasuals(projectId) { const casuals = DB.casuals.filter(c => c.project_id === projectId && c.active); document.getElementById('dlf-casuals').innerHTML = casuals.length ? casuals.map(c => `<label style="display:flex;align-items:center;gap:8px;padding:8px 4px;font-size:13px;text-transform:none;letter-spacing:0;color:var(--text);font-weight:400;cursor:pointer;min-height:40px"><input type="checkbox" class="dlf-casual" value="${c.id}" style="width:auto;margin:0;min-width:18px;height:18px"><span style="flex:1;min-width:0;word-break:break-word">${escapeHtml(c.name)} <span style="color:var(--text-soft)">- ${escapeHtml(c.role||'-')}</span></span></label>`).join('') : '<div style="padding:8px;color:var(--text-soft);font-size:12px">No casuals added to this project yet</div>'; }

async function saveDailyLog() {
  const project_id = document.getElementById('dlf-project').value;
  const dateStr = document.getElementById('dlf-date').value;
  const hours_worked = parseFloat(document.getElementById('dlf-hours').value);
  const work_done = document.getElementById('dlf-work').value.trim();
  const materials_used = document.getElementById('dlf-materials').value.trim();
  const casuals_present = Array.from(document.querySelectorAll('.dlf-casual:checked')).map(c => c.value);
  if (!project_id || !dateStr || !work_done) { toast('Project, date and work done are required', 'error'); return; }
  const date = fromDateInput(dateStr);
  const project = findProject(project_id);
  showLoading('Submitting log...');
  try {
    const newId = await fsAdd('daily_logs', { project_id, date, work_done, sites_touched: (project.sites||[]).map(s=>s.id), casuals_present, hours_worked: hours_worked || 0, materials_used, submitted_by: currentUser.id, submitted_at: Date.now(), status: 'submitted' });
    DB.daily_logs.push({ id:newId, project_id, date, work_done, casuals_present, hours_worked: hours_worked||0, materials_used, submitted_by: currentUser.id, submitted_at: Date.now(), status:'submitted' });
    auditLog('Submitted Daily Log', `${project.name} on ${fmtDate(date)}`);
    const adminUser = DB.users.find(u => u.role === 'admin');
    if (adminUser) {
      const notifId = await fsAdd('notifications', { recipient_id: adminUser.id, type:'log_submitted', title:'Daily Log Submitted', message:`${currentUser.full_name||currentUser.username} submitted a log for ${project.name}`, link: { view:'project-detail', param: project_id }, read:false, created_at: Date.now() });
      DB.notifications.unshift({ id:notifId, recipient_id: adminUser.id, type:'log_submitted', title:'Daily Log Submitted', message:`${currentUser.full_name||currentUser.username} submitted a log for ${project.name}`, link:{view:'project-detail',param:project_id}, read:false, created_at: Date.now() });
      if (adminUser.phone) await SMSService.send(adminUser.phone, SMS.logSubmitted(currentUser.full_name||currentUser.username, project.name, fmtDate(date), hours_worked||0, work_done.slice(0,60)), 'logSubmitted');
    }
    hideLoading(); closeModal(); toast('Daily log submitted'); navigate('logs');
  } catch(e) { hideLoading(); console.error(e); toast('Failed: '+e.message, 'error'); }
}

function renderFinancials() {
  if (currentUser.type !== 'admin') return renderFunds();
  const totalBudget = DB.projects.reduce((s,p) => s + (p.budget||0), 0);
  const totalSpent = DB.budgets.reduce((s,b) => s + (b.expenditure||[]).reduce((x,e)=>x+(e.amount||0),0), 0);
  const totalApprovedFunds = DB.budgets.reduce((s,b) => s + (b.additional_funds||[]).filter(f=>f.status==='approved').reduce((x,f)=>x+(f.approved_amount||0),0), 0);
  const totalPendingFunds = DB.budgets.reduce((s,b) => s + (b.additional_funds||[]).filter(f=>f.status==='pending').reduce((x,f)=>x+(f.amount||0),0), 0);
  const overallRemaining = totalBudget - totalSpent - totalApprovedFunds;
  const pendingFundsList = [];
  DB.budgets.forEach(b => (b.additional_funds||[]).filter(f => f.status === 'pending').forEach(f => { pendingFundsList.push({ ...f, project: findProject(b.project_id), tl: findTL(f.requested_by) }); }));
  if (!DB.projects.length) return `<div class="section-head"><div><span class="hash"># Finance</span><h2>Financials</h2></div></div><div class="card empty-state"><i class="fas fa-wallet"></i><div class="msg">Create a project first to see financials</div></div>`;
  return `<div class="section-head"><div><span class="hash"># Finance</span><h2>Financials</h2><div class="sub">Budget, expenditure and additional funds across all projects</div></div></div>
    <div class="grid grid-4 mb-4">
      <div class="card metric-card"><div class="m-label">Total Budget</div><div class="m-value"><span class="highlight">${fmtKES(totalBudget)}</span></div><div class="m-sub">${DB.projects.length} project${DB.projects.length!==1?'s':''}</div></div>
      <div class="card metric-card"><div class="m-label">Total Outflow</div><div class="m-value" style="color:var(--danger)">${fmtKES(totalSpent + totalApprovedFunds)}</div><div class="m-sub">expenditure + approved funds</div></div>
      <div class="card metric-card"><div class="m-label">Remaining</div><div class="m-value" style="color:${overallRemaining>=0?'var(--primary)':'var(--danger)'}">${fmtKES(overallRemaining)}</div><div class="m-sub">after all outflow</div></div>
      <div class="card metric-card"><div class="m-label">Pending Requests</div><div class="m-value" style="color:var(--accent)">${fmtKES(totalPendingFunds)}</div><div class="m-sub">${pendingFundsList.length} request${pendingFundsList.length!==1?'s':''} (not yet deducted)</div></div>
    </div>
    ${pendingFundsList.length ? `<div class="card mb-4" style="border-left:3px solid var(--accent)"><h4 style="font-size:14px;margin-bottom:10px"><i class="fas fa-coins" style="color:var(--accent)"></i> Pending Fund Requests</h4>${pendingFundsList.map(f => `<div style="padding:10px 0;border-bottom:1px solid var(--border)"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div style="flex:1;min-width:220px"><div style="font-weight:600">${fmtKES(f.amount)} - ${escapeHtml(f.project?.name||'-')}</div><div style="font-size:12px;color:var(--text-soft);margin-top:2px">${escapeHtml(f.reason||'')}</div><div style="font-size:11px;color:var(--text-soft);margin-top:4px">SMP ${f.project?.smp||'-'} - Requested by ${f.tl?escapeHtml(f.tl.full_name||f.tl.username):'-'} - ${timeAgo(f.requested_at)}</div></div><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><button class="btn btn-xs btn-success" onclick="approveFund('${f.project.id}','${f.id}')"><i class="fas fa-check"></i> Approve</button><button class="btn btn-xs btn-danger" onclick="rejectFund('${f.project.id}','${f.id}')"><i class="fas fa-times"></i> Decline</button></div></div></div>`).join('')}</div>` : ''}
    <div class="grid grid-2 mb-4"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px"><h4 style="font-size:14px"><i class="fas fa-chart-line" style="color:var(--primary)"></i> Monthly Spend Trend</h4></div><div class="chart-box"><canvas id="chartMonthlyTrend"></canvas></div></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px"><h4 style="font-size:14px"><i class="fas fa-chart-pie" style="color:var(--secondary)"></i> Expense Categories</h4></div><div class="chart-box"><canvas id="chartCategory"></canvas></div></div></div>
    <div class="grid grid-2 mb-4"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px"><h4 style="font-size:14px"><i class="fas fa-chart-bar" style="color:var(--accent)"></i> Budget vs Outflow per Project</h4></div><div class="chart-box tall"><canvas id="chartProjectBudget"></canvas></div></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px"><h4 style="font-size:14px"><i class="fas fa-chart-area" style="color:var(--primary)"></i> Cumulative Spend</h4></div><div class="chart-box tall"><canvas id="chartCumulative"></canvas></div></div></div>
    <div class="grid grid-2 mb-4"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px"><h4 style="font-size:14px"><i class="fas fa-trophy" style="color:var(--accent)"></i> Top Spending Projects</h4></div><div class="chart-box"><canvas id="chartTopSpend"></canvas></div></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px"><h4 style="font-size:14px"><i class="fas fa-hand-holding-usd" style="color:var(--secondary)"></i> Fund Request Status</h4></div><div class="chart-box"><canvas id="chartFundStatus"></canvas></div></div></div>
    <div class="card"><h4 style="font-size:14px;margin-bottom:12px">Per-Project Breakdown</h4><div class="table-wrap"><table><tr><th>Project</th><th>SMP</th><th>PO</th><th>Budget</th><th>Spent</th><th>Approved Funds</th><th>Remaining</th><th>Used %</th></tr>${DB.projects.map(p => { const t = projectTotals(p.id); const used = t.spent + t.approvedFunds; const pct = t.allocated ? Math.round((used/t.allocated)*100) : 0; return `<tr class="clickable-row" onclick="navigate('project-detail','${p.id}')"><td data-label="Project"><b>${escapeHtml(p.name)}</b></td><td data-label="SMP">${escapeHtml(p.smp||'-')}</td><td data-label="PO">${escapeHtml(p.po_number||'-')}</td><td data-label="Budget">${fmtKES(t.allocated)}</td><td data-label="Spent">${fmtKES(t.spent)}</td><td data-label="Approved Funds"><span style="color:var(--danger)">- ${fmtKES(t.approvedFunds)}</span>${t.pendingFunds?`<br><span style="color:var(--accent);font-size:11px">${fmtKES(t.pendingFunds)} pending</span>`:''}</td><td data-label="Remaining" style="font-weight:600;color:${t.remaining>=0?'var(--primary)':'var(--danger)'}">${fmtKES(t.remaining)}</td><td data-label="Used %"><span style="font-weight:600;color:${pct>100?'var(--danger)':pct>80?'var(--accent)':'var(--primary)'}">${pct}%</span></td></tr>`; }).join('')}</table></div></div>`;
}

function renderFinancialCharts() {
  if (typeof Chart === 'undefined') { setTimeout(renderFinancialCharts, 300); return; }
  if (!document.getElementById('chartMonthlyTrend')) return;
  destroyCharts();
  const palette = ['#1e6b3a','#1a6dff','#e67e22','#8a5fd6','#d63a6a','#2a8a4a','#c0392b','#16a085'];
  const gridColor = 'rgba(26,42,36,0.06)';
  Chart.defaults.font.family = "'Inter', sans-serif"; Chart.defaults.color = '#4d5f57'; Chart.defaults.font.size = 11;
  try {
    const now = new Date(); const months = [];
    for (let i = 5; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push({ key: d.getFullYear()+'-'+d.getMonth(), label: d.toLocaleDateString('en-GB',{month:'short',year:'2-digit'}) }); }
    const monthlyTotals = months.map(m => DB.budgets.reduce((sum,b) => sum + (b.expenditure||[]).filter(e => { const d = new Date(tsToMillis(e.date)); return (d.getFullYear()+'-'+d.getMonth()) === m.key; }).reduce((s,e)=>s+(e.amount||0),0), 0));
    const el = document.getElementById('chartMonthlyTrend');
    if (el) _charts.trend = new Chart(el, { type:'line', data:{ labels:months.map(m=>m.label), datasets:[{ label:'Spend', data:monthlyTotals, borderColor:'#1e6b3a', backgroundColor:'rgba(30,107,58,0.10)', fill:true, tension:0.35, pointBackgroundColor:'#1e6b3a', pointRadius:4 }] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:ctx=>'KES '+ctx.parsed.y.toLocaleString('en-KE')}}}, scales:{x:{grid:{display:false}}, y:{grid:{color:gridColor}, ticks:{callback:v=>v>=1000?(v/1000)+'k':v}}} } });
    const byCat = {}; DB.budgets.forEach(b => (b.expenditure||[]).forEach(e => { const c = (e.item||'Other').split(' ')[0]; byCat[c] = (byCat[c]||0) + (e.amount||0); }));
    const catLabels = Object.keys(byCat); const elCat = document.getElementById('chartCategory');
    if (elCat && catLabels.length) _charts.category = new Chart(elCat, { type:'doughnut', data:{ labels:catLabels, datasets:[{ data:catLabels.map(c=>byCat[c]), backgroundColor:catLabels.map((_,i)=>palette[i%palette.length]), borderWidth:2, borderColor:'#fff' }] }, options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{legend:{position:'bottom', labels:{boxWidth:10, padding:10, font:{size:11}}}, tooltip:{callbacks:{label:ctx=>ctx.label+': KES '+ctx.parsed.toLocaleString('en-KE')}}} } });
    const elProj = document.getElementById('chartProjectBudget');
    if (elProj) { const rows = DB.projects.map(p => { const t = projectTotals(p.id); return { name: p.name.length>18?p.name.slice(0,16)+'...':p.name, outflow: t.spent + t.approvedFunds, remaining:Math.max(0,t.remaining) }; }); if (rows.length) _charts.proj = new Chart(elProj, { type:'bar', data:{ labels:rows.map(r=>r.name), datasets:[{label:'Outflow',data:rows.map(r=>r.outflow),backgroundColor:'#e67e22',borderRadius:6,maxBarThickness:32},{label:'Remaining',data:rows.map(r=>r.remaining),backgroundColor:'#1e6b3a',borderRadius:6,maxBarThickness:32}] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{boxWidth:10,padding:12}}, tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': KES '+ctx.parsed.y.toLocaleString('en-KE')}}}, scales:{x:{stacked:true,grid:{display:false},ticks:{autoSkip:false,maxRotation:30,font:{size:10}}}, y:{stacked:true,grid:{color:gridColor},ticks:{callback:v=>v>=1000?(v/1000)+'k':v}}} } }); }
    const elCum = document.getElementById('chartCumulative');
    if (elCum) { const all = []; DB.budgets.forEach(b => (b.expenditure||[]).forEach(e => all.push(e))); all.sort((a,b)=>tsToMillis(a.date)-tsToMillis(b.date)); if (all.length) { let r=0; const pts = all.map(e => { r += (e.amount||0); return { x: fmtDate(e.date), y: r }; }); _charts.cum = new Chart(elCum, { type:'line', data:{ labels:pts.map(p=>p.x), datasets:[{ label:'Cumulative', data:pts.map(p=>p.y), borderColor:'#1a6dff', backgroundColor:'rgba(26,109,255,0.10)', fill:true, tension:0.25, pointBackgroundColor:'#1a6dff', pointRadius:3 }] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:ctx=>'KES '+ctx.parsed.y.toLocaleString('en-KE')}}}, scales:{x:{grid:{display:false},ticks:{maxRotation:45,font:{size:10}}}, y:{grid:{color:gridColor},ticks:{callback:v=>v>=1000?(v/1000)+'k':v}}} } }); } }
    const elTop = document.getElementById('chartTopSpend');
    if (elTop) { const rows = DB.projects.map(p => { const t = projectTotals(p.id); return { name: p.name, outflow: t.spent + t.approvedFunds }; }).sort((a,b)=>b.outflow-a.outflow).slice(0,6); if (rows.length && !rows.every(r=>r.outflow===0)) _charts.top = new Chart(elTop, { type:'bar', data:{ labels:rows.map(r=>r.name.length>20?r.name.slice(0,18)+'...':r.name), datasets:[{label:'Outflow',data:rows.map(r=>r.outflow),backgroundColor:rows.map((_,i)=>palette[i%palette.length]),borderRadius:6,maxBarThickness:22}] }, options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:ctx=>'KES '+ctx.parsed.x.toLocaleString('en-KE')}}}, scales:{x:{grid:{color:gridColor},ticks:{callback:v=>v>=1000?(v/1000)+'k':v}}, y:{grid:{display:false},ticks:{font:{size:11}}}} } }); }
    const elFund = document.getElementById('chartFundStatus');
    if (elFund) { const counts={pending:0,approved:0,rejected:0}; const amts={pending:0,approved:0,rejected:0}; DB.budgets.forEach(b => (b.additional_funds||[]).forEach(f => { counts[f.status]=(counts[f.status]||0)+1; const a = f.status==='approved'?(f.approved_amount||f.amount):f.amount; amts[f.status]=(amts[f.status]||0)+a; })); const total = counts.pending+counts.approved+counts.rejected; if (total) _charts.fund = new Chart(elFund, { type:'doughnut', data:{ labels:['Pending','Approved','Rejected'], datasets:[{ data:[amts.pending,amts.approved,amts.rejected], backgroundColor:['#e67e22','#1e6b3a','#dc3545'], borderWidth:2, borderColor:'#fff' }] }, options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{legend:{position:'bottom',labels:{boxWidth:10,padding:10,font:{size:11}}}, tooltip:{callbacks:{label:ctx=>{const k=['pending','approved','rejected'][ctx.dataIndex]; return ctx.label+': KES '+ctx.parsed.toLocaleString('en-KE')+' ('+counts[k]+')';}}}} } }); }
  } catch(e) { console.error('Chart error:', e); }
}

function renderFunds() {
  const myProjects = DB.projects.filter(p => p.team_leader_id === currentUser.id).map(p => p.id);
  const myFunds = [];
  DB.budgets.forEach(b => { if (!myProjects.includes(b.project_id)) return; (b.additional_funds||[]).forEach(f => myFunds.push({ ...f, project: findProject(b.project_id) })); });
  myFunds.sort((a,b)=>tsToMillis(b.requested_at)-tsToMillis(a.requested_at));
  return `<div class="section-head"><div><span class="hash"># Finance</span><h2>My Fund Requests</h2><div class="sub">${myFunds.length} request${myFunds.length!==1?'s':''}</div></div><button class="btn btn-primary" onclick="openFundRequestPickerModal()"><i class="fas fa-plus"></i> Request Funds</button></div>${myFunds.length ? `<div class="table-wrap"><table><tr><th>Project</th><th>SMP</th><th>Amount</th><th>Reason</th><th>Status</th><th>Date</th></tr>${myFunds.map(f => `<tr><td data-label="Project"><b>${escapeHtml(f.project?.name||'-')}</b></td><td data-label="SMP">${escapeHtml(f.project?.smp||'-')}</td><td data-label="Amount">${fmtKES(f.amount)}</td><td data-label="Reason" style="font-size:12px">${escapeHtml(f.reason||'')}</td><td data-label="Status"><span class="badge badge-${f.status}">${f.status}</span></td><td data-label="Date" style="font-size:11px">${timeAgo(f.requested_at)}</td></tr>`).join('')}</table></div>` : `<div class="card empty-state"><i class="fas fa-coins"></i><div class="msg">No fund requests yet</div></div>`}`;
}

function openFundRequestPickerModal() {
  const myProjects = DB.projects.filter(p => p.team_leader_id === currentUser.id);
  if (!myProjects.length) { toast('You have no projects assigned yet', 'error'); return; }
  if (myProjects.length === 1) { openFundRequestModal(myProjects[0].id); return; }
  const body = `<div class="field"><label>Select Project</label><select id="frp-project">${myProjects.map(p => `<option value="${p.id}">${escapeHtml(p.name)} - SMP ${escapeHtml(p.smp||'-')}</option>`).join('')}</select></div>`;
  openModal('Request Funds — Choose Project', body, [{ label:'Cancel', cls:'btn btn-outline', onclick:'closeModal()' }, { label:'Continue', cls:'btn btn-primary', onclick:'const pid = document.getElementById("frp-project").value; closeModal(); setTimeout(()=>openFundRequestModal(pid), 300);' }]);
}

function myNotifications() { if (!currentUser) return []; return DB.notifications.filter(n => n.recipient_id === currentUser.id); }
function updateNotifBadge() { const dot = document.getElementById('notifDot'); if (!dot) return; const c = myNotifications().filter(n=>!n.read).length; if (c>0){dot.textContent=c;dot.style.display='inline-block';}else{dot.style.display='none';} }
function renderNotifications() { const list = myNotifications().sort((a,b)=>tsToMillis(b.created_at)-tsToMillis(a.created_at)); return `<div class="section-head"><div><span class="hash"># Alerts</span><h2>Notifications</h2><div class="sub">${list.filter(n=>!n.read).length} unread</div></div>${list.some(n=>!n.read)?`<button class="btn btn-sm btn-outline" onclick="markAllRead()">Mark all read</button>`:''}</div>${list.length?list.map(n=>`<div class="card mb-2" style="padding:14px 18px;border-left:3px solid ${n.read?'var(--border)':'var(--primary)'};cursor:pointer" onclick="openNotif('${n.id}')"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div style="flex:1;min-width:180px"><div style="font-weight:600">${escapeHtml(n.title||'')}</div><div style="font-size:13px;color:var(--text-soft);margin-top:3px">${escapeHtml(n.message||'')}</div></div><div style="font-size:11px;color:var(--text-soft)">${timeAgo(n.created_at)}</div></div></div>`).join(''):'<div class="card empty-state"><i class="fas fa-bell"></i><div class="msg">No notifications yet</div></div>'}`; }
async function openNotif(id) { const n = DB.notifications.find(x=>x.id===id); if (!n) return; n.read = true; try { await fsUpdate('notifications', id, { read: true }); } catch(e){} if (n.link) navigate(n.link.view, n.link.param); else navigate('notifications'); updateNotifBadge(); }
async function markAllRead() { const mine = myNotifications().filter(n=>!n.read); for (const n of mine) { n.read = true; try { await fsUpdate('notifications', n.id, { read:true }); } catch(e){} } navigate('notifications'); toast('All marked as read'); }

async function auditLog(action, desc) { try { const entry = { user: currentUser?.full_name || currentUser?.username || 'system', action, desc, at: Date.now() }; const id = await fsAdd('audit', entry); DB.audit.unshift({ id, ...entry }); } catch(e) { console.error('audit failed', e); } }
function renderAudit() { const list = DB.audit.slice().sort((a,b)=>tsToMillis(b.at)-tsToMillis(a.at)).slice(0,100); return `<div class="section-head"><div><span class="hash"># History</span><h2>Audit Log</h2></div></div>${list.length?`<div class="table-wrap"><table><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr>${list.map(a=>`<tr><td data-label="Time" style="font-size:11px;color:var(--text-soft)">${timeAgo(a.at)}</td><td data-label="User"><b>${escapeHtml(a.user||'')}</b></td><td data-label="Action">${escapeHtml(a.action||'')}</td><td data-label="Details" style="font-size:12px">${escapeHtml(a.desc||'')}</td></tr>`).join('')}</table></div>`:'<div class="card empty-state"><i class="fas fa-history"></i><div class="msg">No activity yet</div></div>'}`; }

async function saveProject(id) {
  const name = document.getElementById('pf-name').value.trim();
  const smp = document.getElementById('pf-smp').value.trim();
  const po_number = document.getElementById('pf-po').value.trim();
  const site_module_package = document.getElementById('pf-module').value.trim();
  const region = document.getElementById('pf-region').value.trim();
  const location = document.getElementById('pf-location').value.trim();
  const client = document.getElementById('pf-client').value.trim();
  const budget = parseFloat(document.getElementById('pf-budget').value) || 0;
  const startVal = document.getElementById('pf-start').value;
  const endVal = document.getElementById('pf-end').value;
  const start = startVal ? fromDateInput(startVal) : null;
  const end = endVal ? fromDateInput(endVal) : null;
  const team_leader_id = document.getElementById('pf-tl').value || null;
  const description = document.getElementById('pf-desc').value.trim();
  const status = document.getElementById('pf-status').value;
  if (!name || !smp) { toast('Name and SMP are required', 'error'); return; }
  if (start && end && end < start) { toast('End date must be after start date', 'error'); return; }
  showLoading('Saving project...');
  try {
    if (id) {
      const p = findProject(id); const oldTL = p.team_leader_id;
      const patch = { name, smp, po_number, site_module_package, region, location, client, budget, start, end, team_leader_id, description, status };
      await fsUpdate('projects', id, patch); Object.assign(p, patch);
      auditLog('Updated Project', name); toast('Project updated');
      if (team_leader_id && team_leader_id !== oldTL) { const tl = findTL(team_leader_id); if (tl?.phone) await SMSService.send(tl.phone, SMS.tlProjectAssigned(tl.full_name||tl.username, name, smp, po_number), 'tlProjectAssigned'); }
      if (oldTL && oldTL !== team_leader_id) { const old = findTL(oldTL); if (old?.phone) await SMSService.send(old.phone, SMS.tlProjectRemoved(name), 'tlProjectRemoved'); }
    } else {
      const newId = await fsAdd('projects', { name, smp, po_number, site_module_package, region, location, client, description, budget, currency:'KES', status, start, end, team_leader_id, created_by: currentUser.id, sites: [] });
      await fsSet('budgets', newId, { project_id: newId, allocated: budget, expenditure: [], additional_funds: [] });
      DB.projects.push({ id:newId, name, smp, po_number, site_module_package, region, location, client, description, budget, status, start, end, team_leader_id, sites: [] });
      DB.budgets.push({ id:newId, project_id:newId, allocated:budget, expenditure:[], additional_funds:[] });
      auditLog('Created Project', `${name} (${smp})`);
      toast('Project created');
      if (team_leader_id) { const tl = findTL(team_leader_id); if (tl?.phone) await SMSService.send(tl.phone, SMS.tlProjectAssigned(tl.full_name||tl.username, name, smp, po_number), 'tlProjectAssigned'); }
    }
    hideLoading(); closeModal(); navigate('projects');
  } catch(e) { hideLoading(); console.error(e); toast('Failed: '+e.message, 'error'); }
}

async function deleteProject(id) {
  const p = findProject(id); if (!p) return;
  if (!confirm(`Delete "${p.name}"? Casuals, logs and budget will also be removed.`)) return;
  if (!await requireAdminPassword('delete project ' + p.name)) return;
  showLoading('Deleting...');
  try {
    for (const c of DB.casuals.filter(x=>x.project_id===id)) await fsDelete('casuals', c.id);
    for (const l of DB.daily_logs.filter(x=>x.project_id===id)) await fsDelete('daily_logs', l.id);
    if (DB.budgets.find(b=>b.project_id===id)) await fsDelete('budgets', id);
    await fsDelete('projects', id);
    DB.projects = DB.projects.filter(x=>x.id!==id);
    DB.casuals = DB.casuals.filter(c=>c.project_id!==id);
    DB.daily_logs = DB.daily_logs.filter(l=>l.project_id!==id);
    DB.budgets = DB.budgets.filter(b=>b.project_id!==id);
    auditLog('Deleted Project', p.name);
    hideLoading(); toast('Project deleted'); navigate('projects');
  } catch(e) { hideLoading(); console.error(e); toast('Failed: '+e.message, 'error'); }
}

async function saveExpense(projectId) {

async function approveFund(projectId, fundId) {
  const b = DB.budgets.find(x=>x.project_id===projectId); if (!b) return;
  const funds = [...(b.additional_funds||[])]; const f = funds.find(x=>x.id===fundId); if (!f) return;
  const amt = prompt('Approve amount (KES):', f.amount); if (amt === null) return;
  const n = parseFloat(amt); if (!n || n <= 0) { toast('Invalid amount', 'error'); return; }
  f.status='approved'; f.approved_amount=n; f.approved_by=currentUser.id; f.approved_at=Date.now();
  try {
    await fsUpdate('budgets', projectId, { additional_funds: funds }); b.additional_funds = funds;
    auditLog('Approved Funds', `${fmtKES(n)} for ${findProject(projectId)?.name}`);
    if (f.requested_by) { 
      const tl = findTL(f.requested_by); 
      const proj = findProject(projectId); 
      if (tl) { 
        const nid = await fsAdd('notifications', { recipient_id: tl.id, type:'fund_approved', title:'Funds Approved', message:`Your request of ${fmtKES(n)} for "${proj?.name}" was approved.`, link:{view:'project-detail',param:projectId}, read:false, created_at: Date.now() }); 
        DB.notifications.unshift({ id:nid, recipient_id: tl.id, type:'fund_approved', title:'Funds Approved', message:`Your request of ${fmtKES(n)} for "${proj?.name}" was approved.`, link:{view:'project-detail',param:projectId}, read:false, created_at: Date.now() }); 
        if (tl.phone) await SMSService.send(tl.phone, SMS.fundApproved(n, proj?.name||''), 'fundApproved');

        if (adminUser?.phone) {

          await SMSService.send(adminUser.phone, msg, 'fundApproved');
        }
      } 
    }
    toast('Funds approved'); navigate(currentView, projectId);
  } catch(e) { console.error(e); toast('Failed: '+e.message, 'error'); }
}

  loadSmsSettings();
  await new Promise((resolve) => { if (window.firebaseAuth) return resolve(); window.addEventListener('firebase-ready', resolve, { once: true }); setTimeout(resolve, 3000); });
  if (!window.firebaseAuth) { toast('Firebase failed to load. Check your internet and refresh.', 'error'); return; }
  const restored = await restoreSession();
  if (!restored) { document.getElementById('loginScreen').style.display = 'flex'; document.getElementById('appRoot').style.display = 'none'; }
  console.log('NEWL AFRICA ready (Firebase-backed).');
  console.log('SMS mode:', smsSettings.dryRun ? 'DRY RUN' : 'LIVE via Cloudflare Worker');
}
init();
</script>
</body>
