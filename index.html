<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e6b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NEWL AFRICA · Projects · Teams · Financials</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link rel="icon" type="image/png" href="img/icon.png">
<style>
/* ============ RESET & BASE ============ */
:root{
  --primary:#1e6b3a;--primary-light:#2a8a4a;--primary-dark:#15502a;--primary-bg:#e6f4ec;
  --secondary:#1a6dff;--accent:#e67e22;--danger:#dc3545;
  --bg:#f6faf8;--surface:#fff;--border:#e8f0ec;
  --text:#1a2a24;--text-soft:#4d5f57;--text-light:#8a9f95;
  --radius:12px;--radius-lg:20px;--radius-sm:8px;--radius-pill:999px;
  --shadow-sm:0 1px 3px rgba(21,80,42,.06);
  --shadow-hover:0 8px 30px rgba(30,107,58,0.08);
  --shadow-lg:0 20px 60px rgba(21,80,42,0.10);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  font-size:14px;line-height:1.5;
}
img,svg,canvas{max-width:100%;height:auto;display:block}
button,input,select,textarea{font-family:inherit;font-size:inherit}

/* Prevent iOS zoom on input focus (min 16px) */
@media(max-width:820px){
  input,select,textarea{font-size:16px!important}
}

/* Scrollbars — thin on desktop, hidden on mobile */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--primary-light)}
@media(max-width:820px){::-webkit-scrollbar{width:0;height:0}}

/* ============ APP SHELL ============ */
.app-root{
  width:100%;max-width:1440px;margin:0 auto;
  padding:0 max(12px,var(--safe-right)) calc(30px + var(--safe-bottom)) max(12px,var(--safe-left));
}
@media(min-width:640px){.app-root{padding-left:max(16px,var(--safe-left));padding-right:max(16px,var(--safe-right))}}

/* ============ LOGIN SCREEN ============ */
.login-screen{
  min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 20% 15%,rgba(30,107,58,0.08),transparent 45%),var(--bg);
  padding:calc(20px + var(--safe-top)) 16px calc(20px + var(--safe-bottom));
}
.login-box{
  background:var(--surface);padding:clamp(24px,5vw,40px) clamp(20px,5vw,36px);
  border-radius:clamp(20px,5vw,28px);box-shadow:var(--shadow-lg);
  border:1px solid var(--border);max-width:440px;width:100%;
}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.login-logo .mark{
  background:var(--primary);color:#fff;
  width:clamp(40px,10vw,44px);height:clamp(40px,10vw,44px);
  border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:clamp(20px,5vw,22px);flex-shrink:0;
}
.login-tag{color:var(--text-soft);font-size:clamp(12px,3vw,13px);margin:4px 0 22px;line-height:1.6}
.login-tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:var(--radius-pill);margin-bottom:20px}
.login-tabs button{
  flex:1;padding:10px 8px;border:none;background:transparent;color:var(--text-soft);
  font-weight:600;font-size:12px;cursor:pointer;border-radius:var(--radius-pill);
  transition:all .2s;font-family:inherit;min-height:40px;
}
.login-tabs button.active{background:var(--surface);color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.06)}

/* ============ FIELDS ============ */
.field{margin-bottom:14px}
.field label{
  font-size:11px;font-weight:600;color:var(--text-soft);text-transform:uppercase;
  letter-spacing:.05em;display:block;margin-bottom:6px;
}
.field-row{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.field-row{grid-template-columns:1fr 1fr}}

input,select,textarea{
  width:100%;padding:12px 14px;background:var(--surface);
  border:1.5px solid var(--border);border-radius:var(--radius);
  color:var(--text);font-size:15px;transition:all .2s;
  min-height:46px;
}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(30,107,58,.12);
}
input[readonly]{background:var(--bg);color:var(--text-soft)}
textarea{resize:vertical;min-height:80px;line-height:1.5}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 18px;border-radius:var(--radius-pill);
  font-weight:600;font-size:13px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);cursor:pointer;
  transition:all .15s;text-decoration:none;font-family:inherit;
  white-space:nowrap;min-height:44px;line-height:1;
  touch-action:manipulation;
}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--shadow-hover)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--primary-dark);border-color:var(--primary-dark)}
.btn-secondary{background:var(--secondary);border-color:var(--secondary);color:#fff}
.btn-success{background:var(--primary-light);border-color:var(--primary-light);color:#fff}
.btn-danger{color:var(--danger);border-color:#f5c6cb;background:var(--surface)}
.btn-danger:hover:not(:disabled){background:#f8d7da;border-color:var(--danger)}
.btn-outline{background:transparent;border-color:var(--border)}
.btn-outline-primary{background:transparent;border-color:var(--primary);color:var(--primary)}
.btn-outline-primary:hover:not(:disabled){background:var(--primary);color:#fff}
.btn-sm{padding:8px 14px;font-size:12px;min-height:38px}
.btn-xs{padding:6px 10px;font-size:11px;min-height:32px;gap:5px}
.btn-block{width:100%}
.btn .spinner{
  width:14px;height:14px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ CARDS ============ */
.card{
  background:var(--surface);border-radius:var(--radius-lg);
  border:1px solid var(--border);padding:clamp(14px,3vw,20px);
  transition:box-shadow .2s;
}
.card-hover:hover{box-shadow:var(--shadow-hover)}
.card-click{cursor:pointer;touch-action:manipulation}

.metric-card .m-label{
  font-size:10px;font-weight:600;color:var(--text-soft);
  text-transform:uppercase;letter-spacing:.05em;
}
.metric-card .m-value{
  font-size:clamp(18px,4vw,22px);font-weight:700;
  letter-spacing:-.02em;margin-top:4px;line-height:1.2;
  word-break:break-word;
}
.metric-card .m-value .highlight{color:var(--primary)}
.metric-card .m-sub{font-size:11px;color:var(--text-soft);margin-top:2px}

/* ============ BADGES ============ */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 12px;border-radius:var(--radius-pill);
  font-size:10px;font-weight:600;text-transform:uppercase;
  letter-spacing:.04em;white-space:nowrap;
}
.badge::before{content:"";width:5px;height:5px;border-radius:50%}
.badge-active{background:#e6f4ec;color:var(--primary)}.badge-active::before{background:var(--primary)}
.badge-draft{background:var(--bg);color:var(--text-soft)}.badge-draft::before{background:var(--text-soft)}
.badge-completed{background:#e3f0ff;color:var(--secondary)}.badge-completed::before{background:var(--secondary)}
.badge-pending{background:#fff3e0;color:var(--accent)}.badge-pending::before{background:var(--accent)}
.badge-paused{background:#fff3e0;color:var(--accent)}.badge-paused::before{background:var(--accent)}
.badge-on_hold{background:var(--bg);color:var(--text-soft)}.badge-on_hold::before{background:var(--text-soft)}
.badge-pending_approval{background:#fff3e0;color:var(--accent)}.badge-pending_approval::before{background:var(--accent)}
.badge-approved{background:#e6f4ec;color:var(--primary)}.badge-approved::before{background:var(--primary)}
.badge-rejected{background:#f8d7da;color:#721c24}.badge-rejected::before{background:var(--danger)}
.badge-inactive{background:var(--bg);color:var(--text-soft)}.badge-inactive::before{background:var(--text-soft)}
.badge-queued{background:var(--bg);color:var(--text-soft)}.badge-queued::before{background:var(--text-soft)}
.badge-accepted{background:#e3f0ff;color:var(--secondary)}.badge-accepted::before{background:var(--secondary)}
.badge-delivered{background:#e6f4ec;color:var(--primary)}.badge-delivered::before{background:var(--primary)}
.badge-failed{background:#f8d7da;color:#721c24}.badge-failed::before{background:var(--danger)}
.badge-dry_run{background:#fff3e0;color:var(--accent)}.badge-dry_run::before{background:var(--accent)}
.badge-sent{background:#e6f4ec;color:var(--primary)}.badge-sent::before{background:var(--primary)}

/* ============ CHIPS ============ */
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:var(--radius-pill);
  font-size:12px;font-weight:500;background:var(--surface);
  border:1px solid var(--border);color:var(--text-soft);
  cursor:pointer;transition:all .15s;min-height:36px;
  touch-action:manipulation;
}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.chip:hover:not(.active){background:var(--bg)}
.chip .count{background:rgba(0,0,0,.06);padding:0 6px;border-radius:10px;font-size:10px;margin-left:2px}
.chip.active .count{background:rgba(255,255,255,.25)}

/* ============ GRID SYSTEM (mobile-first) ============ */
.grid{display:grid;gap:clamp(10px,2vw,14px)}
.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}

@media(min-width:520px){
  .grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(min-width:720px){
  .grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(min-width:1024px){
  .grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
}

/* ============ APP SHELL / SIDEBAR ============ */
.app-shell{display:flex;gap:clamp(12px,2vw,20px);margin-top:14px;align-items:flex-start}
.main-area{flex:1;min-width:0;width:100%}

.sidebar{
  width:240px;flex-shrink:0;background:var(--surface);
  border-radius:var(--radius-lg);padding:18px 12px;
  border:1px solid var(--border);height:fit-content;
  position:sticky;top:14px;display:flex;flex-direction:column;
}
.sidebar-logo{
  display:flex;align-items:center;gap:10px;
  padding:0 8px 14px;border-bottom:1px solid var(--border);margin-bottom:12px;
}
.sidebar-logo .mark{
  background:var(--primary);color:#fff;width:36px;height:36px;
  border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
.nav-list{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:11px 12px;border-radius:var(--radius);
  font-weight:500;font-size:13px;color:var(--text-soft);
  transition:all .15s;cursor:pointer;min-height:44px;
  touch-action:manipulation;
}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:#e6f4ec;color:var(--primary);font-weight:600}
.nav-item .icon{width:18px;text-align:center;flex-shrink:0}
.nav-badge{
  margin-left:auto;background:var(--accent);color:#fff;
  font-size:9px;font-weight:700;padding:2px 6px;border-radius:8px;
}
.sidebar-user{
  margin-top:14px;padding-top:12px;border-top:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}
.sidebar-user .avatar{
  width:32px;height:32px;border-radius:10px;background:var(--primary);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:12px;flex-shrink:0;
}
.sidebar-user .u-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-user .u-role{font-size:10px;color:var(--text-soft)}

/* Mobile sidebar */
.sidebar-overlay{display:none}
.menu-btn{display:none}

@media(max-width:900px){
  .app-shell{flex-direction:column;gap:0}
  .sidebar{
    position:fixed;left:0;top:0;z-index:100;
    height:100vh;height:100dvh;width:min(300px,85vw);
    transform:translateX(-100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
    border-radius:0;overflow-y:auto;
    padding:calc(18px + var(--safe-top)) 12px calc(18px + var(--safe-bottom)) 12px;
    box-shadow:0 0 60px rgba(0,0,0,.15);
  }
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay{
    display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);
    z-index:99;opacity:0;pointer-events:none;transition:opacity .28s;
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  }
  .sidebar-overlay.open{opacity:1;pointer-events:auto}
  .menu-btn{display:inline-flex!important}
}

/* ============ TOPBAR ============ */
.topbar{
  background:var(--surface);border-radius:var(--radius-lg);
  padding:10px 14px;border:1px solid var(--border);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-bottom:16px;position:sticky;top:0;z-index:50;
  box-shadow:var(--shadow-sm);
}
.topbar .search{
  flex:1;min-width:0;display:flex;align-items:center;gap:10px;
  background:var(--bg);border-radius:var(--radius-pill);padding:8px 16px;
  min-height:44px;
}
.topbar .search input{background:transparent;border:none;padding:0;font-size:14px;min-height:auto}
.topbar .search input:focus{box-shadow:none;border:none}
.topbar .tb-right{display:flex;gap:6px;align-items:center;flex-shrink:0}
@media(max-width:640px){.topbar .search{display:none}}
@media(max-width:640px){.topbar{padding:8px 12px}}

/* ============ SECTION HEAD ============ */
.section-head{
  display:flex;justify-content:space-between;align-items:flex-start;
  flex-wrap:wrap;gap:12px;margin-bottom:16px;
}
.section-head h2{font-size:clamp(17px,4vw,20px);font-weight:700;letter-spacing:-.02em;line-height:1.2}
.section-head .sub{font-size:12px;color:var(--text-soft);margin-top:3px}
.section-head .hash{
  color:var(--primary);font-weight:700;font-size:11px;
  letter-spacing:1px;text-transform:uppercase;
}
@media(max-width:520px){
  .section-head{flex-direction:column;align-items:stretch}
  .section-head .btn{width:100%;justify-content:center}
}

/* ============ TABLES (responsive → cards on mobile) ============ */
.table-wrap{
  overflow-x:auto;border-radius:var(--radius);
  border:1px solid var(--border);background:var(--surface);
  -webkit-overflow-scrolling:touch;
}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:0}
th{
  text-align:left;padding:11px 14px;font-size:10px;
  text-transform:uppercase;letter-spacing:.06em;color:var(--text-soft);
  border-bottom:1px solid var(--border);font-weight:600;
  background:var(--bg);white-space:nowrap;
}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(30,107,58,.02)}
.clickable-row{cursor:pointer;touch-action:manipulation}
.clickable-row:hover{background:var(--primary-bg)!important}

/* Mobile card-table: transform each row into a card */
@media(max-width:640px){
  .table-wrap{border:none;background:transparent;overflow:visible}
  .table-wrap table,
  .table-wrap thead,
  .table-wrap tbody,
  .table-wrap tr,
  .table-wrap td{display:block;width:100%}
  .table-wrap thead{display:none}
  .table-wrap tr{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;
  }
  .table-wrap tr:hover td{background:transparent}
  .table-wrap td{
    padding:6px 0;border:none;display:flex;
    justify-content:space-between;align-items:center;gap:12px;
    font-size:13px;text-align:right;
  }
  .table-wrap td::before{
    content:attr(data-label);
    font-weight:600;font-size:11px;color:var(--text-soft);
    text-transform:uppercase;letter-spacing:.04em;
    text-align:left;flex-shrink:0;
  }
  .table-wrap td:first-child{
    padding-top:0;border-bottom:1px solid var(--border);
    padding-bottom:10px;margin-bottom:6px;
  }
}

/* ============ MODALS (full-screen on mobile) ============ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.45);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;
  padding:16px;
}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{
  background:var(--surface);border-radius:22px;padding:24px;
  width:min(600px,100%);max-height:min(88vh,88dvh);overflow-y:auto;
  box-shadow:0 24px 64px rgba(0,0,0,.25);
  transform:translateY(10px) scale(.98);transition:transform .25s;
  -webkit-overflow-scrolling:touch;
}
.modal-overlay.open .modal{transform:translateY(0) scale(1)}
.modal.wide{width:min(760px,100%)}
.modal-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:18px;gap:12px;position:sticky;top:-24px;
  background:var(--surface);padding:8px 0;margin-top:-8px;
  z-index:2;
}
.modal-head h3{font-size:17px;font-weight:700;line-height:1.3;flex:1;min-width:0}
.modal-foot{
  display:flex;justify-content:flex-end;gap:8px;
  margin-top:20px;flex-wrap:wrap;
}
.modal-foot .btn{flex:1 1 auto;min-width:120px}
.modal-close{
  background:var(--bg);border:none;width:38px;height:38px;
  border-radius:10px;cursor:pointer;color:var(--text-soft);
  font-size:14px;flex-shrink:0;touch-action:manipulation;
}
.modal-close:hover{background:var(--border)}

/* Full-screen modals on small screens */
@media(max-width:560px){
  .modal-overlay{padding:0;align-items:flex-end}
  .modal{
    border-radius:22px 22px 0 0;
    max-height:94vh;max-height:94dvh;
    width:100%;
    padding:20px 16px calc(20px + var(--safe-bottom)) 16px;
  }
  .modal.wide{width:100%;border-radius:22px 22px 0 0}
  .modal-head{top:-20px;padding-top:4px}
  .modal-foot{
    position:sticky;bottom:calc(-20px - var(--safe-bottom));
    background:var(--surface);
    padding:12px 0 calc(12px + var(--safe-bottom)) 0;
    margin:20px -16px calc(-20px - var(--safe-bottom)) -16px;
    padding-left:16px;padding-right:16px;
    border-top:1px solid var(--border);
  }
  .modal-foot .btn{flex:1}
}

/* ============ TOASTS ============ */
.toast-stack{
  position:fixed;
  bottom:calc(20px + var(--safe-bottom));
  right:max(20px,var(--safe-right));
  left:max(20px,var(--safe-left));
  z-index:300;display:flex;flex-direction:column;gap:8px;
  pointer-events:none;align-items:flex-end;
}
.toast{
  padding:13px 18px;border-radius:14px;background:var(--surface);
  border:1px solid var(--border);color:var(--text);
  font-weight:500;font-size:13px;width:100%;max-width:380px;
  box-shadow:0 8px 32px rgba(0,0,0,.14);animation:toastIn .3s;
  border-left:3px solid var(--primary);pointer-events:auto;
  word-break:break-word;
}
.toast.error{border-left-color:var(--danger)}
.toast.info{border-left-color:var(--secondary)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:480px){
  .toast-stack{left:12px;right:12px}
  .toast{max-width:100%}
}

/* ============ TABS ============ */
.tabs{
  display:flex;gap:4px;border-bottom:1px solid var(--border);
  margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:12px 16px;border:none;background:transparent;
  color:var(--text-soft);font-weight:600;font-size:13px;
  cursor:pointer;border-bottom:2px solid transparent;
  transition:all .15s;font-family:inherit;white-space:nowrap;
  flex-shrink:0;min-height:44px;touch-action:manipulation;
}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}

/* ============ PROGRESS ============ */
.progress-bar{height:6px;background:var(--bg);border-radius:var(--radius-pill);overflow:hidden}
.progress-bar .fill{height:100%;background:var(--primary);border-radius:var(--radius-pill);transition:width .4s}

/* ============ CRED BOX ============ */
.cred-box{
  background:var(--bg);border:1px dashed var(--border);
  border-radius:12px;padding:14px 14px 14px 14px;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  font-size:12px;color:var(--text);word-break:break-all;
  margin-top:6px;position:relative;line-height:1.7;
}
.cred-box .copy{
  position:absolute;top:8px;right:8px;background:var(--surface);
  border:1px solid var(--border);border-radius:8px;padding:4px 10px;
  font-size:10px;cursor:pointer;font-family:'Inter',sans-serif;
  font-weight:600;color:var(--text-soft);touch-action:manipulation;
}
.cred-box .copy:hover{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ============ CHARTS ============ */
.chart-box{position:relative;width:100%;height:240px;min-height:240px}
.chart-box.tall{height:280px;min-height:280px}
.chart-box canvas{display:block!important;width:100%!important;height:100%!important}
@media(max-width:640px){
  .chart-box{height:200px;min-height:200px}
  .chart-box.tall{height:240px;min-height:240px}
}

/* ============ SMS ROWS ============ */
.sms-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--border);
  font-size:13px;gap:12px;
}
.sms-row:last-child{border-bottom:none}
.switch{
  width:44px;height:24px;background:var(--border);
  border-radius:var(--radius-pill);position:relative;
  cursor:pointer;transition:.2s;flex-shrink:0;touch-action:manipulation;
}
.switch.on{background:var(--primary)}
.switch::after{
  content:'';position:absolute;width:18px;height:18px;background:#fff;
  border-radius:50%;top:3px;left:3px;transition:.2s;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.switch.on::after{left:23px}

.sms-log-item{padding:12px 14px;border-bottom:1px solid var(--border);font-size:12px}
.sms-log-item:last-child{border-bottom:none}
.sms-log-item .sms-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.sms-log-item .sms-to{font-weight:600;color:var(--text);word-break:break-all}
.sms-log-item .sms-time{color:var(--text-soft);font-size:11px;flex-shrink:0}
.sms-log-item .sms-msg{color:var(--text-soft);line-height:1.5;word-break:break-word}

/* ============ LOADING ============ */
.loading-overlay{
  position:fixed;inset:0;background:rgba(255,255,255,.92);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;z-index:999;padding:20px;
}
.loading-overlay .spinner{
  width:40px;height:40px;border:3px solid var(--border);
  border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;
}
.loading-overlay .txt{font-size:13px;color:var(--text-soft);font-weight:500;text-align:center}

/* ============ UTILITIES ============ */
.text-muted{color:var(--text-soft)}
.text-primary{color:var(--primary)}
.fw-600{font-weight:600}
.fw-700{font-weight:700}
.mb-0{margin-bottom:0}.mb-1{margin-bottom:4px}.mb-2{margin-bottom:8px}
.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}
.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}
.d-flex{display:flex}.align-center{align-items:center}.justify-between{justify-content:space-between}
.gap-2{gap:8px}.gap-3{gap:12px}.flex-wrap{flex-wrap:wrap}
.hidden{display:none!important}
.empty-state{padding:40px 20px;text-align:center;color:var(--text-soft)}
.empty-state i{font-size:32px;margin-bottom:12px;opacity:.4;display:block}
.empty-state .msg{font-size:13px}

/* ============ PRINT ============ */
@media print{
  .sidebar,.topbar,.menu-btn,.modal-overlay,.toast-stack{display:none!important}
  .app-root{max-width:100%;padding:0}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
}

/* ============ LANDSCAPE PHONE ============ */
@media(max-height:520px) and (orientation:landscape){
  .login-screen{padding:12px}
  .login-box{padding:20px}
  .modal{max-height:92vh;max-height:92dvh}
}

/* ============ VERY SMALL PHONES (320px) ============ */
@media(max-width:360px){
  .app-root{padding-left:10px;padding-right:10px}
  .btn{padding:10px 14px;font-size:12px}
  .btn-xs{padding:5px 8px;font-size:10px}
  .metric-card .m-value{font-size:17px}
  .section-head h2{font-size:16px}
}

/* ============ TABLET / DESKTOP ============ */
@media(min-width:901px){
  .menu-btn{display:none!important}
  .sidebar-overlay{display:none!important}
}

/* ============ LARGE DESKTOP ============ */
@media(min-width:1440px){
  .app-root{max-width:1440px}
  .sidebar{width:260px}
}

/* ============ REDUCED MOTION ============ */
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

<script>
const SMS_SETTINGS_KEY = 'newl_sms_settings_v1';
const APP_URL = window.location.origin + window.location.pathname;
const LOGIN_URL = APP_URL;
const DEFAULT_WORKER_URL = 'https://newl-sms.manchamdevelopers.workers.dev';

let DB = { users: [], projects: [], casuals: [], daily_logs: [], budgets: [], notifications: [], audit: [] };
let currentUser = null;
let firebaseUser = null;
let currentView = 'home';
let _searchTerm = '';
let _charts = {};

const SMS_DEFAULTS = {
  provider: 'cloudflare', senderId: 'MOBILESASA', dryRun: false, workerUrl: DEFAULT_WORKER_URL,
  events: {
    tlWelcome: true, tlProjectAssigned: true, tlProjectRemoved: true, tlPasswordReset: true,
    fundRequested: true, fundApproved: true, fundDeclined: true, logSubmitted: true,
    projectCompleted: true, projectApproved: true, projectReturned: true,
    casualAddedToCasual: true, casualAddedToAdmin: true,
    casualRemovedFromCasual: true, casualRemovedFromAdmin: true
  }
};
let smsSettings = null;
function loadSmsSettings() {
  try { const raw = localStorage.getItem(SMS_SETTINGS_KEY); if (raw) { smsSettings = { ...SMS_DEFAULTS, ...JSON.parse(raw) }; if (!smsSettings.workerUrl) smsSettings.workerUrl = DEFAULT_WORKER_URL; return; } } catch(e){}
  smsSettings = JSON.parse(JSON.stringify(SMS_DEFAULTS));
}
function saveSmsSettings() { try { localStorage.setItem(SMS_SETTINGS_KEY, JSON.stringify(smsSettings)); } catch(e){} }
function smsEventEnabled(k) { return smsSettings?.events?.[k] !== false; }

const SMSService = {
  _log: [],
  async send(phone, message, eventKey) {
    if (!phone || !message) return { ok:false, error:'missing' };
    if (eventKey && !smsEventEnabled(eventKey)) return { ok:true, skipped:true };
    const normalized = this._normalizePhone(phone);
    if (!normalized) { this._log.unshift({ to: phone, message, status:'failed', error:'invalid_phone', at: Date.now(), eventKey }); return { ok:false, error:'invalid_phone' }; }
    const trackingId = 'sms_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
    const entry = { to: normalized, message, at: Date.now(), eventKey, trackingId, status:'pending' };
    this._log.unshift(entry);
    if (this._log.length > 300) this._log.pop();
    if (smsSettings.dryRun) { entry.status = 'dry_run'; console.log('[SMS DRY RUN]', entry); return { ok:true, dryRun:true, trackingId }; }
    if (!smsSettings.workerUrl) { entry.status = 'failed'; entry.error = 'no_worker_url'; return { ok:false, error:'no_worker_url' }; }
    try {
      const res = await fetch(smsSettings.workerUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone: normalized, message, senderId: smsSettings.senderId }) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) { entry.status = 'failed'; entry.error = data.error || res.statusText || 'send_failed'; console.error('[SMS] Failed:', entry.error, data); return { ok:false, error: entry.error }; }
      entry.status = 'sent'; entry.response = data.data;
      console.log('[SMS] Sent to', normalized);
      return { ok:true, data: data.data };
    } catch(e) { entry.status = 'failed'; entry.error = e.message; console.error('[SMS] Network error:', e); return { ok:false, error: e.message }; }
  },
  _normalizePhone(p) { const d = String(p).replace(/\D/g,''); if (d.startsWith('254') && d.length===12) return d; if (d.startsWith('0') && d.length===10) return '254' + d.slice(1); if ((d.startsWith('7')||d.startsWith('1')) && d.length===9) return '254' + d; return null; },
  log() { return this._log.slice(); }, clearLog() { this._log = []; }
};

const SMS = {
  tlWelcome: (n,u,p) => `Welcome ${n}. You are now a Team Leader at NEWL AFRICA. Login: ${LOGIN_URL} Username: ${u} Password: ${p}`,
  tlProjectAssigned: (n,proj,smp,po) => `${n}, you have been assigned to "${proj}"${smp?' (SMP '+smp+')':''}${po?' (PO '+po+')':''}. Login ${LOGIN_URL} to onboard your casual workers and start submitting daily logs.`,
  tlProjectRemoved: (proj) => `You have been removed from "${proj}". Contact admin if unexpected.`,
  tlPasswordReset: (np) => `Your NEWL AFRICA password has been reset. New password: ${np}. Login: ${LOGIN_URL}`,
  fundRequested: (tl,proj,amt,reason) => `${tl} requested KES ${Number(amt).toLocaleString()} on "${proj}". Reason: ${reason}`.slice(0,160),
  fundApproved: (amt,proj) => `Your request of KES ${Number(amt).toLocaleString()} on "${proj}" was APPROVED. Login: ${LOGIN_URL}`,
  fundDeclined: (amt,proj,reason) => `Your request of KES ${Number(amt).toLocaleString()} on "${proj}" was DECLINED.${reason?' Reason: '+reason:''}`.slice(0,160),
  logSubmitted: (tl,proj,date,hrs,sum) => `LOG: ${tl} on "${proj}" (${date}). ${hrs}h - ${sum}`.slice(0,160),
  projectCompleted: (tl,proj) => `${tl} marked "${proj}" COMPLETE. Review at ${LOGIN_URL}`,
  projectApproved: (proj) => `Project "${proj}" has been approved and marked complete.`,
  projectReturned: (proj,reason) => `Project "${proj}" was sent back.${reason?' Reason: '+reason:''}`,
  casualAdded: (n,proj,tl) => `Hi ${n}, you have been added to "${proj}" by ${tl}. Report to site supervisor.`,
  casualAddedAdmin: (tl,cn,ph,proj) => `${tl} added casual ${cn} (${ph}) to "${proj}"`,
  casualRemoved: (n,proj,tl) => `Hi ${n}, you have been removed from "${proj}". Contact ${tl} for details.`,
  casualRemovedAdmin: (tl,cn,proj) => `${tl} removed casual ${cn} from "${proj}"`,
  test: () => `Test message from NEWL AFRICA. If you received this, SMS is working. ${new Date().toLocaleString('en-GB')}`
};

function toast(msg, type='info') {
  const stack = document.getElementById('toastStack');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = msg;
  stack.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transform='translateY(8px)'; t.style.transition='all .25s'; setTimeout(() => t.remove(), 300); }, 3200);
}
function escapeHtml(s) { return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]); }
function fmtKES(n) { if (n==null||isNaN(n)) return 'KES 0'; const neg = n < 0; const v = 'KES ' + Math.abs(Number(n)).toLocaleString('en-KE'); return neg ? '-' + v : v; }
function fmtDate(ts) { if (!ts) return '—'; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateInput(ts) { if (!ts) return ''; const d = ts.toDate ? ts.toDate() : new Date(ts); const p = n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function fromDateInput(v) { if (!v) return null; const [y,m,d]=v.split('-').map(Number); return new Date(y,m-1,d).getTime(); }
function tsToMillis(ts) { if (!ts) return 0; if (ts.toDate) return ts.toDate().getTime(); if (typeof ts === 'number') return ts; return new Date(ts).getTime(); }
function timeAgo(ts) { const t = tsToMillis(ts); const s = Math.floor((Date.now()-t)/1000); if (s<60) return 'just now'; if (s<3600) return Math.floor(s/60)+'m ago'; if (s<86400) return Math.floor(s/3600)+'h ago'; if (s<604800) return Math.floor(s/86400)+'d ago'; return fmtDate(ts); }
function initials(n) { return (n||'U').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join(''); }
function genPassword() { const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'; let o='NLA-'; for(let i=0;i<6;i++)o+=c[Math.floor(Math.random()*c.length)]; return o; }

function normalizePhoneInput(el) {
  let v = (el.value || '').trim();
  if (!v) return;
  if (v.startsWith('+')) return;
  const d = v.replace(/\D/g,'');
  if (d.startsWith('254') && d.length === 12) el.value = '+' + d;
  else if (d.startsWith('0') && d.length === 10) el.value = '+254' + d.slice(1);
  else if ((d.startsWith('7')||d.startsWith('1')) && d.length === 9) el.value = '+254' + d;
}

async function requireAdminPassword(actionLabel) {
  const pwd = prompt(`Confirm your admin password to ${actionLabel}:`);
  if (!pwd) return false;
  const adminEmail = (currentUser.email && currentUser.email.includes('@')) ? currentUser.email : (currentUser.username || 'admin') + '@newl.africa';
  try { await window.fbAuth.signInWithEmailAndPassword(window.firebaseAuth, adminEmail, pwd); return true; }
  catch(e) { toast('Wrong admin password. Aborted.', 'error'); return false; }
}

function findProject(id) { return DB.projects.find(p=>p.id===id); }
function findTL(id) { return DB.users.find(u=>u.id===id); }
function findCasual(id) { return DB.casuals.find(c=>c.id===id); }
function projectBudget(pid) { return DB.budgets.find(b=>b.project_id===pid) || { id:null, project_id:pid, allocated:0, expenditure:[], additional_funds:[] }; }
function projectTotals(pid) {
  const p = findProject(pid);
  const b = projectBudget(pid);
  const allocated = p ? (p.budget||0) : 0;
  const spent = (b.expenditure||[]).reduce((s,e)=>s+(e.amount||0),0);
  const approvedFunds = (b.additional_funds||[]).filter(f=>f.status==='approved').reduce((s,f)=>s+(f.approved_amount||0),0);
  const pendingFunds = (b.additional_funds||[]).filter(f=>f.status==='pending').reduce((s,f)=>s+(f.amount||0),0);
  const remaining = allocated - spent - approvedFunds;
  return { allocated, spent, approvedFunds, pendingFunds, remaining };
}
function projectProgress(pid) {
  const p = findProject(pid); if (!p) return { total:0, completed:0, pct:0 };
  if (p.status==='completed') return { total:1, completed:1, pct:100 };
  const logs = DB.daily_logs.filter(l=>l.project_id===pid).length;
  const pct = Math.min(90, logs*8 + (p.status==='active'?10:0));
  return { total:0, completed:0, pct };
}

function showLoading(txt) { document.getElementById('loadingText').textContent = txt || 'Loading...'; document.getElementById('loadingOverlay').style.display='flex'; }
function hideLoading() { document.getElementById('loadingOverlay').style.display='none'; }

async function loadAllData() {
  showLoading('Loading your data...');
  try {
    const { collection, getDocs } = window.fbDb;
    const db = window.firebaseDb;
    const [usersSnap, projectsSnap, casualsSnap, logsSnap, budgetsSnap, notifsSnap, auditSnap] = await Promise.all([
      getDocs(collection(db, 'users')), getDocs(collection(db, 'projects')), getDocs(collection(db, 'casuals')),
      getDocs(collection(db, 'daily_logs')), getDocs(collection(db, 'budgets')), getDocs(collection(db, 'notifications')), getDocs(collection(db, 'audit'))
    ]);
    DB.users = usersSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    DB.projects = projectsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    DB.casuals = casualsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    DB.daily_logs = logsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    DB.budgets = budgetsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    DB.notifications = notifsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    DB.audit = auditSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    console.log('📦 Loaded:', { users: DB.users.length, projects: DB.projects.length, casuals: DB.casuals.length, logs: DB.daily_logs.length, budgets: DB.budgets.length, notifications: DB.notifications.length, audit: DB.audit.length });
  } catch(e) { console.error('Load failed:', e); toast('Failed to load data: ' + e.message, 'error'); }
  finally { hideLoading(); }
}

async function fsAdd(collectionName, data) { const { collection, addDoc, serverTimestamp } = window.fbDb; const ref = await addDoc(collection(window.firebaseDb, collectionName), { ...data, created_at: serverTimestamp() }); return ref.id; }
async function fsSet(collectionName, docId, data) { const { doc, setDoc, serverTimestamp } = window.fbDb; await setDoc(doc(window.firebaseDb, collectionName, docId), { ...data, updated_at: serverTimestamp() }, { merge: true }); }
async function fsUpdate(collectionName, docId, data) { const { doc, updateDoc, serverTimestamp } = window.fbDb; await updateDoc(doc(window.firebaseDb, collectionName, docId), { ...data, updated_at: serverTimestamp() }); }
async function fsDelete(collectionName, docId) { const { doc, deleteDoc } = window.fbDb; await deleteDoc(doc(window.firebaseDb, collectionName, docId)); }

function switchLoginTab(tab) { document.querySelectorAll('.login-tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab)); document.getElementById('adminForm').style.display = tab === 'admin' ? 'block' : 'none'; document.getElementById('tlForm').style.display = tab === 'team_leader' ? 'block' : 'none'; }

async function handleLogin(e, role) {
  e.preventDefault();
  const btn = role === 'admin' ? document.getElementById('adminLoginBtn') : document.getElementById('tlLoginBtn');
  const original = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Signing in...';
  const usernameInput = role === 'admin' ? 'adminUser' : 'tlUser';
  const passwordInput = role === 'admin' ? 'adminPass' : 'tlPass';
  const username = document.getElementById(usernameInput).value.trim();
  const password = document.getElementById(passwordInput).value;
  if (!username || !password) { btn.disabled = false; btn.innerHTML = original; toast('Username and password required', 'error'); return; }
  const email = username.includes('@') ? username : username + '@newl.africa';
  try {
    const cred = await window.fbAuth.signInWithEmailAndPassword(window.firebaseAuth, email, password);
    firebaseUser = cred.user;
    const { doc, getDoc } = window.fbDb;
    const userSnap = await getDoc(doc(window.firebaseDb, 'users', cred.user.uid));
    if (!userSnap.exists()) { await window.fbAuth.signOut(window.firebaseAuth); throw new Error('Your account has no profile. Contact admin.'); }
    const profile = { id: userSnap.id, ...userSnap.data() };
    if (profile.role !== role) { await window.fbAuth.signOut(window.firebaseAuth); throw new Error(`This account is not a ${role.replace('_',' ')}.`); }
    currentUser = { ...profile, type: profile.role };
    await loadAllData();
    enterApp();
  } catch(err) { console.error(err); let msg = err.message || 'Login failed'; if (msg.includes('auth/invalid-credential') || msg.includes('auth/wrong-password') || msg.includes('auth/user-not-found')) msg = 'Invalid credentials'; toast(msg, 'error'); }
  finally { btn.disabled = false; btn.innerHTML = original; }
}

async function logout() { try { await window.fbAuth.signOut(window.firebaseAuth); } catch(e){} currentUser = null; firebaseUser = null; document.getElementById('appRoot').style.display = 'none'; document.getElementById('loginScreen').style.display = 'flex'; }

async function restoreSession() {
  return new Promise((resolve) => {
    const unsubscribe = window.fbAuth.onAuthStateChanged(window.firebaseAuth, async (fbUser) => {
      unsubscribe();
      if (!fbUser) return resolve(false);
      try {
        const { doc, getDoc } = window.fbDb;
        const snap = await getDoc(doc(window.firebaseDb, 'users', fbUser.uid));
        if (!snap.exists()) { await window.fbAuth.signOut(window.firebaseAuth); return resolve(false); }
        const profile = { id: snap.id, ...snap.data() };
        currentUser = { ...profile, type: profile.role };
        firebaseUser = fbUser;
        await loadAllData();
        enterApp();
        resolve(true);
      } catch(e) { console.error(e); resolve(false); }
    });
  });
}

function enterApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
  document.getElementById('sideName').textContent = currentUser.full_name || currentUser.username;
  document.getElementById('sideRole').textContent = currentUser.type === 'admin' ? 'Administrator' : 'Team Leader';
  document.getElementById('sideAvatar').textContent = initials(currentUser.full_name || currentUser.username);
  buildNav();
  navigate('home');
  updateNotifBadge();
}

function buildNav() { const items = navItems(); document.getElementById('navList').innerHTML = items.map(i => `<div class="nav-item" data-view="${i.key}" onclick="navigate('${i.key}')"><span class="icon">${i.icon}</span><span>${i.label}</span>${i.badge ? `<span class="nav-badge">${i.badge}</span>` : ''}</div>`).join(''); }

function navigate(view, param) {
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === view));
  closeSidebar();
  const area = document.getElementById('viewArea');
  let html = '';
  try {
    switch(view) {
      case 'home': html = currentUser.type === 'admin' ? renderAdminHome() : renderTLHome(); break;
      case 'projects': html = renderProjects(); break;
      case 'project-detail': html = renderProjectDetail(param); break;
      case 'team-leaders': html = renderTeamLeaders(); break;
      case 'casuals': html = renderCasuals(); break;
      case 'logs': html = renderLogs(); break;
      case 'financials': html = renderFinancials(); break;
      case 'funds': html = renderFunds(); break;
      case 'notifications': html = renderNotifications(); break;
      case 'audit': html = renderAudit(); break;
      case 'settings': html = renderSettings(); break;
      default: html = '<div class="card">View not found</div>';
    }
  } catch(e) { console.error(e); html = `<div class="card" style="color:var(--danger)">Error: ${escapeHtml(e.message)}</div>`; }
  area.innerHTML = html;
  window.scrollTo({top:0, behavior:'smooth'});
  updateNotifBadge();
  destroyCharts();
  if (view === 'financials' && currentUser.type === 'admin') requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(renderFinancialCharts, 80)));
}

let _projTab = 'overview';

function renderProjectDetail(id) {
  const p = findProject(id);
  if (!p) return '<div class="card">Project not found</div>';
  if (currentUser.type === 'team_leader' && p.team_leader_id !== currentUser.id) return '<div class="card">Access denied</div>';
  const tl = findTL(p.team_leader_id); const prog = projectProgress(id);
  const casuals = DB.casuals.filter(c => c.project_id === id);
  const logs = DB.daily_logs.filter(l => l.project_id === id).sort((a,b) => tsToMillis(b.date) - tsToMillis(a.date));
  const isTL = currentUser.type === 'team_leader' && p.team_leader_id === currentUser.id;
  const isAdmin = currentUser.type === 'admin';
  const tabs = isAdmin ? ['overview','casuals','logs','financials'] : ['overview','casuals','logs'];
  if (p.sites && p.sites.length) tabs.push('sites');
  let tabContent = '';
  if (_projTab === 'overview') tabContent = renderProjOverview(p, prog, tl, isAdmin);
  else if (_projTab === 'casuals') tabContent = renderProjCasuals(p, casuals, isTL);
  else if (_projTab === 'logs') tabContent = renderProjLogs(p, logs);
  else if (_projTab === 'financials' && isAdmin) tabContent = renderProjFinancials(p);
  else if (_projTab === 'sites') tabContent = renderProjSites(p);
  return `

async function saveProjectAssignments(tlId) {
  const tl = findTL(tlId);
  if (!tl) return;
  const selected = Array.from(document.querySelectorAll('.assign-proj:checked')).map(c => c.value);
  const previouslyAssigned = DB.projects.filter(p => p.team_leader_id === tlId).map(p => p.id);
  const added = selected.filter(id => !previouslyAssigned.includes(id));
  const removed = previouslyAssigned.filter(id => !selected.includes(id));
  if (!added.length && !removed.length) { toast('No changes', 'info'); closeModal(); return; }
  showLoading('Updating assignments...');
  try {
    for (const pid of selected) {
      await fsUpdate('projects', pid, { team_leader_id: tlId });
      const p = findProject(pid); if (p) p.team_leader_id = tlId;
    }
    for (const pid of removed) {
      await fsUpdate('projects', pid, { team_leader_id: null });
      const p = findProject(pid); if (p) p.team_leader_id = null;
    }
    tl.project_ids = selected;
    await fsUpdate('users', tlId, { project_ids: selected });
    auditLog('Updated TL assignments', `${tl.full_name||tl.username}: +${added.length} -${removed.length}`);
    toast(`Assignments updated — ${added.length} added, ${removed.length} removed`);
    if (tl.phone) {
      for (const pid of added) {
        const proj = findProject(pid);
        if (proj) await SMSService.send(tl.phone, SMS.tlProjectAssigned(tl.full_name||tl.username, proj.name, proj.smp, proj.po_number), 'tlProjectAssigned');
      }
    }
    hideLoading(); closeModal(); navigate('team-leaders');
  } catch(e) { hideLoading(); console.error(e); toast('Failed: '+e.message, 'error'); }
}

function openSendMessageModal(tlId) {
  const tl = findTL(tlId);
  if (!tl) return;
  if (!tl.phone) { toast('No phone on record for this TL', 'error'); return; }
  const body = `
    <div style="font-size:13px;color:var(--text-soft);margin-bottom:12px">
      Send a direct message to <b>${escapeHtml(tl.full_name||tl.username)}</b><br>
      Phone: ${escapeHtml(tl.phone)}
    </div>
    <div class="field"><label>Message</label>
      <textarea id="direct-msg" placeholder="Type your message..." style="min-height:110px"></textarea>
    </div>
    <div style="font-size:11px;color:var(--text-soft);text-align:right" id="direct-msg-count">0 characters</div>
  `;
  openModal('Send Message to TL', body, [
    { label:'Cancel', cls:'btn btn-outline', onclick:'closeModal()' },
    { label:'Send SMS + In-App', cls:'btn btn-primary', onclick:`sendDirectMessage('${tlId}')` }
  ]);
  const ta = document.getElementById('direct-msg');
  const counter = document.getElementById('direct-msg-count');
  ta.addEventListener('input', () => { counter.textContent = ta.value.length + ' characters'; });
  ta.focus();
}

async function sendDirectMessage(tlId) {
  const tl = findTL(tlId);
  if (!tl) return;
  const msg = (document.getElementById('direct-msg').value || '').trim();
  if (!msg) { toast('Message cannot be empty', 'error'); return; }
  showLoading('Sending...');
  try {
    const nid = await fsAdd('notifications', { recipient_id: tl.id, type:'admin_message', title:'Message from Admin', message: msg, link:null, read:false, created_at: Date.now() });
    DB.notifications.unshift({ id:nid, recipient_id: tl.id, type:'admin_message', title:'Message from Admin', message: msg, link:null, read:false, created_at: Date.now() });
    if (tl.phone) {
      const smsMsg = `NEWL AFRICA admin: ${msg}`.slice(0,160);
      await SMSService.send(tl.phone, smsMsg, null);
    }
    auditLog('Sent direct message', `To ${tl.full_name||tl.username}: ${msg.slice(0,60)}`);
    toast('Message sent (in-app + SMS)');
    hideLoading(); closeModal(); navigate('team-leaders');
  } catch(e) { hideLoading(); console.error(e); toast('Failed: '+e.message, 'error'); }
}

ze:12px">No projects yet. Create one first.</div>'}</div></div>`;
  openModal(editId?'Edit Team Leader':'New Team Leader', body, [{ label:'Cancel', cls:'btn btn-outline', onclick:'closeModal()' }, { label: editId?'Save':'Create', cls:'btn btn-primary', onclick:`saveTL(${editId?`'${editId}'`:'null'})` }]);

async function saveTL(id) {
  const full_name = document.getElementById('tlf-name').value.trim();
  const phoneRaw = document.getElementById('tlf-phone').value.trim();
  const email = document.getElementById('tlf-email').value.trim();
  const username = document.getElementById('tlf-username').value.trim();
  const project_ids = Array.from(document.querySelectorAll('.tlf-proj:checked')).map(c => c.value);
  if (!full_name || !username) { toast('Name and username required', 'error'); return; }
  let phone = phoneRaw;
  if (phone && !phone.startsWith('+')) {
    const d = phone.replace(/\D/g,'');
    if (d.startsWith('0') && d.length === 10) phone = '+254' + d.slice(1);
    else if ((d.startsWith('7')||d.startsWith('1')) && d.length === 9) phone = '+254' + d;
    else phone = '+' + d;
  }
  if (!id) {
    const pwdCheck = prompt('Confirm your admin password to create this Team Leader:');
    if (!pwdCheck) { toast('Cancelled', 'info'); return; }
    const adminEmail = (currentUser.email && currentUser.email.includes('@')) ? currentUser.email : (currentUser.username || 'admin') + '@newl.africa';
    try { await window.fbAuth.signInWithEmailAndPassword(window.firebaseAuth, adminEmail, pwdCheck); }
    catch(e) { toast('Wrong admin password. Aborted.', 'error'); return; }
  }
  const duplicate = DB.users.find(t => t.username === username && t.id !== id && t.role === 'team_leader');
  if (duplicate) { toast('Username already in use', 'error'); return; }
  showLoading('Saving team leader...');
  try {
    if (id) {
      const tl = findTL(id);
      const oldIds = (DB.projects.filter(x=>x.team_leader_id===tl.id).map(x=>x.id));
      const patch = { full_name, phone, email, username, project_ids };
      await fsUpdate('users', id, patch);
      Object.assign(tl, patch);
      for (const pid of project_ids) { if (!oldIds.includes(pid)) { await fsUpdate('projects', pid, { team_leader_id: id }); const p = findProject(pid); if (p) p.team_leader_id = id; } }
      for (const pid of oldIds) { if (!project_ids.includes(pid)) { await fsUpdate('projects', pid, { team_leader_id: null }); const p = findProject(pid); if (p) p.team_leader_id = null; } }
      auditLog('Updated Team Leader', full_name);
      toast('Team leader updated');
      const addedProjects = project_ids.filter(pid => !oldIds.includes(pid));
      if (phone) { for (const pid of addedProjects) { const proj = findProject(pid); if (proj) await SMSService.send(phone, SMS.tlProjectAssigned(full_name, proj.name, proj.smp, proj.po_number), 'tlProjectAssigned'); } }
    } else {
      const emailLogin = username + '@newl.africa';
      const password = genPassword();
      const cred = await window.fbAuth.createUserWithEmailAndPassword(window.firebaseAuth, emailLogin, password);
      const newUid = cred.user.uid;
      await fsSet('users', newUid, { full_name, username, email, phone, role: 'team_leader', project_ids, created_by: currentUser.id, initial_password: password });
      for (const pid of project_ids) { await fsUpdate('projects', pid, { team_leader_id: newUid }); const p = findProject(pid); if (p) p.team_leader_id = newUid; }
      DB.users.push({ id: newUid, full_name, username, email, phone, role: 'team_leader', project_ids, initial_password: password });
      auditLog('Created Team Leader', `${full_name} (${username})`);
      const credMessage = `Username: ${username}\nLogin email: ${emailLogin}\nPassword: ${password}`;
      try { navigator.clipboard.writeText(credMessage); toast('Credentials copied to clipboard'); } catch(e) {}
      const adminEmailForReauth = (currentUser.email && currentUser.email.includes('@')) ? currentUser.email : (currentUser.username || 'admin') + '@newl.africa';
      await window.fbAuth.signOut(window.firebaseAuth);
      const pwd = prompt(`Team Leader created.\n\nUsername: ${username}\nPassword: ${password}\n\n(Also copied to clipboard)\n\nRe-enter YOUR admin password to continue:`, '');
      if (!pwd) { toast('Session ended. Please log back in.', 'info'); setTimeout(() => { logout(); }, 800); hideLoading(); return; }
      try { await window.fbAuth.signInWithEmailAndPassword(window.firebaseAuth, adminEmailForReauth, pwd); }
      catch(e) { console.error('Re-auth failed', e); toast('Wrong password. Please log back in.', 'error'); setTimeout(() => { logout(); }, 1200); hideLoading(); return; }
      if (phone) {
        await SMSService.send(phone, SMS.tlWelcome(full_name, username, password), 'tlWelcome');
        for (const pid of project_ids) { const proj = findProject(pid); if (proj) await SMSService.send(phone, SMS.tlProjectAssigned(full_name, proj.name, proj.smp, proj.po_number), 'tlProjectAssigned'); }
      }
    }
    hideLoading(); closeModal(); navigate('team-leaders');
  } catch(e) { hideLoading(); console.error(e); let msg = e.message || 'Failed'; if (msg.includes('auth/email-already-in-use')) msg = 'Username already registered. Try a different one, or delete the orphaned Auth user in Firebase Console.'; toast(msg, 'error'); }
}

async function resetTLPassword(id) {
  const tl = findTL(id); if (!tl) return;
  if (!await requireAdminPassword('reset password for ' + (tl.full_name||tl.username))) return;
  const newPwd = prompt(`Enter new password for ${tl.full_name || tl.username}:`, genPassword());
  if (!newPwd) return;
  try { await fsUpdate('users', id, { initial_password: newPwd }); tl.initial_password = newPwd; toast(`Password updated. Click "Send via SMS" to notify.`); navigate('team-leaders'); }
  catch(e) { toast('Failed: '+e.message, 'error'); }
}

async function sendTLCredentials(id) {
  const tl = findTL(id); if (!tl) return;
  if (!tl.phone) { toast('No phone on record for this TL', 'error'); return; }
  const pwd = tl.initial_password || '(ask admin to reset your password)';
  await SMSService.send(tl.phone, SMS.tlWelcome(tl.full_name || tl.username, tl.username, pwd), 'tlWelcome');
  toast(`Credentials SMS sent to ${escapeHtml(tl.phone)}`);
}
function copyText(text) { if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('Copied')); else prompt('Copy:', text); }

async function deleteTL(id) {
  const tl = findTL(id); if (!tl) return;
  if (!confirm(`Delete ${tl.full_name||tl.username}? Their projects will become unassigned.`)) return;
  if (!await requireAdminPassword('delete Team Leader ' + (tl.full_name||tl.username))) return;
  showLoading('Deleting...');
  try {
    const projects = DB.projects.filter(p => p.team_leader_id === id);
    for (const p of projects) await fsUpdate('projects', p.id, { team_leader_id: null });
    await fsDelete('users', id);
    DB.users = DB.users.filter(u => u.id !== id);
    DB.projects.forEach(p => { if (p.team_leader_id === id) p.team_leader_id = null; });
    auditLog('Deleted Team Leader', tl.full_name || tl.username);
    toast('Team leader removed (Auth account remains — delete via console)');
    hideLoading(); navigate('team-leaders');
  } catch(e) { hideLoading(); console.error(e); toast('Failed: '+e.message, 'error'); }
}

async function saveCasual(id) {
  const name = document.getElementById('cf-name').value.trim();
  const phone = document.getElementById('cf-phone').value.trim();
  const role = document.getElementById('cf-role').value.trim();
  const daily_rate = parseFloat(document.getElementById('cf-rate').value) || 0;
  const project_id = document.getElementById('cf-project').value;
  if (!name || !phone) { toast('Name and phone required', 'error'); return; }
  if (!project_id) { toast('Please select a project (or ask admin to assign you one)', 'error'); return; }
  const project = findProject(project_id);
  const adminUser = DB.users.find(u => u.role === 'admin');
  showLoading('Saving casual...');
  try {
    if (id) {
      const c = findCasual(id);
      await fsUpdate('casuals', id, { name, phone, role, daily_rate, project_id });
      Object.assign(c, { name, phone, role, daily_rate, project_id });
      auditLog('Updated Casual', name);
      toast('Casual updated');
    } else {
      const newId = await fsAdd('casuals', { name, phone, role, daily_rate, project_id, added_by: currentUser.id, added_at: Date.now(), active: true });
      DB.casuals.push({ id: newId, name, phone, role, daily_rate, project_id, added_by: currentUser.id, added_at: Date.now(), active: true });
      auditLog('Added Casual', `${name} to ${project?.name||''}`);
      toast('Casual added');
      if (phone) await SMSService.send(phone, SMS.casualAdded(name, project?.name||'', currentUser.full_name||currentUser.username), 'casualAddedToCasual');
      if (adminUser?.phone) await SMSService.send(adminUser.phone, SMS.casualAddedAdmin(currentUser.full_name||currentUser.username, name, phone, project?.name||''), 'casualAddedToAdmin');
    }
    hideLoading(); closeModal();
    navigate(currentView === 'casuals' ? 'casuals' : 'project-detail', currentView === 'project-detail' ? project_id : null);
  } catch(e) { hideLoading(); console.error(e); toast('Failed: '+e.message, 'error'); }
}

async function deleteCasual(id) {
  const c = findCasual(id); if (!c) return;
  if (!confirm(`Remove ${c.name}?`)) return;
  if (!await requireAdminPassword('remove casual ' + c.name)) return;
  const pid = c.project_id; const project = findProject(pid); const adminUser = DB.users.find(u => u.role === 'admin');
  showLoading('Removing...');
  try {
    if (c.phone) await SMSService.send(c.phone, SMS.casualRemoved(c.name, project?.name||'', currentUser.full_name||currentUser.username), 'casualRemovedFromCasual');
    if (adminUser?.phone) await SMSService.send(adminUser.phone, SMS.casualRemovedAdmin(currentUser.full_name||currentUser.username, c.name, project?.name||''), 'casualRemovedFromAdmin');
    await fsDelete('casuals', id);
    DB.casuals = DB.casuals.filter(x => x.id !== id);
    auditLog('Removed Casual', c.name);
    toast('Casual removed');
    hideLoading();
    navigate(currentView === 'project-detail' ? 'project-detail' : 'casuals', currentView === 'project-detail' ? pid : null);
  } catch(e) { hideLoading(); console.error(e); toast('Failed: '+e.message, 'error'); }
}

}

  const myProjects = currentUser.type === 'team_leader' ? DB.projects.filter(p => p.team_leader_id === currentUser.id) : DB.projects;
  if (!myProjects.length) { toast('No projects available', 'error'); return; }

  openModal('Submit Daily Log', body, [{ label:'Cancel', cls:'btn btn-outline', onclick:'closeModal()' }, { label:'Submit', cls:'btn btn-primary', onclick:'saveDailyLog()' }], true);
